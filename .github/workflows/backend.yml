name: Backend
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: demo_test
          POSTGRES_PASSWORD: demo_ci_only
          POSTGRES_DB: sorteos_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U demo_test -d sorteos_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile
      - run: pnpm generate:api
      - run: git diff --exit-code -- docs/openapi.json packages/api-client/src/generated.ts
      - run: pnpm lint
      - run: pnpm typecheck:api
      - run: pnpm test:config
      - run: pnpm test
      - name: PostgreSQL 17 backup tools
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          curl --fail --location --output /tmp/postgresql.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          sudo install -m 644 /tmp/postgresql.asc /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc
          printf '%s\n' 'deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt noble-pgdg main' | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install --yes postgresql-client-17
      - run: pnpm test:integration
        env:
          TEST_DATABASE_URL: postgres://demo_test:demo_ci_only@127.0.0.1:5432/sorteos_test
          TEST_PG_BIN: /usr/lib/postgresql/17/bin
      - run: pnpm build:api
      - run: pnpm --filter @sorteos/web exec playwright install --with-deps chromium firefox webkit
      - run: pnpm test:m4
        env:
          TEST_DATABASE_URL: postgres://demo_test:demo_ci_only@127.0.0.1:5432/sorteos_test
      - run: pnpm test:m5
        env:
          TEST_DATABASE_URL: postgres://demo_test:demo_ci_only@127.0.0.1:5432/sorteos_test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m6-local-evidence
          path: .tmp/m6/*.json
          if-no-files-found: ignore
